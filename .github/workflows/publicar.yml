# Publica el planeador y el panel del administrador en GitHub Pages (solo desde main,
# y solo si todos los sellos son válidos). Activa Pages: Settings → Pages → Source: GitHub Actions.
name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sellos
        env:
          BASE_REF: ${{ github.event.before }}
        run: node scripts/verificar.mjs horarios
      - name: Instalar dependencias (Excel)
        run: npm install --no-audit --no-fund
      - name: Armar sitio
        run: |
          mkdir -p sitio/horarios sitio/reportes
          cp index.html admin.html sitio/
          cp horarios/*.json sitio/horarios/ 2>/dev/null || true
          node scripts/generar-indice.mjs sitio/horarios sitio/reportes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
